spring.application.name=seat-reservation

spring.datasource.url=jdbc:postgresql://localhost:5432/seat_reservation
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

server.port=${PORT:8080}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [request_id=%X{requestId}] %logger{36} - %msg%n
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always